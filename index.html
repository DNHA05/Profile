<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background: #000 url('./banner.gif') center/cover no-repeat fixed;
      color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    /* CARD CHÍNH LỚN */
    .bio-container {
      width: 100%; max-width: 380px;
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    /* CHUNG CHO CÁC BOX PHỤ */
    .card-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 14px;
    }

    /* 1. PROFILE BOX TOP */
    .profile-top { display: flex; align-items: center; gap: 14px; position: relative; }
    .avatar-wrapper { position: relative; width: 80px; height: 80px; flex-shrink: 0; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .avatar-deco { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; pointer-events: none; }
    
    .profile-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .display-name { font-size: 22px; font-weight: 800; color: #fff; }
    
    .badges-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .badge-icon { font-size: 14px; color: rgba(255, 255, 255, 0.8); }
    
    .sub-role { font-size: 13px; color: rgba(255, 255, 255, 0.7); font-weight: 500; }

    /* 2. NOW PLAYING & STATUS BOX */
    .status-music-box { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .sm-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .sm-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .sm-text { display: flex; flex-direction: column; overflow: hidden; }
    .sm-title { font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sm-sub { font-size: 12px; color: rgba(255, 255, 255, 0.5); font-style: italic; }

    .sm-controls { display: flex; align-items: center; gap: 10px; }
    .ctrl-btn { color: #fff; cursor: pointer; font-size: 14px; opacity: 0.8; transition: 0.2s; }
    .ctrl-btn:hover { opacity: 1; transform: scale(1.1); }

    /* 3. GUILD / DISCORD CARD */
    .guild-box { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .guild-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .guild-icon { width: 48px; height: 48px; border-radius: 14px; background: #000; object-fit: cover; flex-shrink: 0; }
    .guild-name { font-size: 14px; font-weight: 800; color: #fff; }
    .guild-stats { font-size: 11px; color: rgba(255, 255, 255, 0.6); display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .dot-online { width: 6px; height: 6px; background: #23a55a; border-radius: 50%; display: inline-block; }
    .dot-member { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; display: inline-block; }

    .join-btn {
      background: #23a55a; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
      padding: 6px 14px; border-radius: 8px; transition: 0.2s;
    }
    .join-btn:hover { background: #1f924e; }

    /* 4. FOOTER VIEW COUNT */
    .view-count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.7); font-weight: 600; padding: 2px 6px; }
  </style>
</head>
<body>

  <audio id="audio-player"></audio>

  <div class="bio-container">
    
    <!-- BOX 1: THÔNG TIN CÁ NHÂN TOP -->
    <div class="card-box profile-top">
      <div class="avatar-wrapper">
        <img id="avatar-deco" class="avatar-deco" style="display:none;" alt="Decoration">
        <img id="discord-avatar" class="avatar-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
      </div>
      <div class="profile-info">
        <div id="display-name" class="display-name">Loading...</div>
        <div class="badges-row">
          <i class="fa-solid fa-bug badge-icon" style="color: #23a55a;"></i>
          <i class="fa-solid fa-gem badge-icon" style="color: #9b59b6;"></i>
          <i class="fa-solid fa-star badge-icon" style="color: #2ecc71;"></i>
          <i class="fa-solid fa-rocket badge-icon" style="color: #e74c3c;"></i>
          <i class="fa-solid fa-shield-halved badge-icon" style="color: #e67e22;"></i>
        </div>
        <div class="sub-role">Helper @sel</div>
      </div>
    </div>

    <!-- BOX 2: NOW PLAYING & TRẠNG THÁI -->
    <div class="card-box status-music-box">
      <div class="sm-left">
        <img id="status-avatar" class="sm-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Mini Avatar">
        <div class="sm-text">
          <div id="song-title" class="sm-title">Đang quét nhạc...</div>
          <div id="status-text" class="sm-sub">Paused</div>
        </div>
      </div>
      <div class="sm-controls">
        <div id="play-btn" class="ctrl-btn"><i id="play-icon" class="fa-solid fa-play"></i></div>
        <div id="next-btn" class="ctrl-btn"><i class="fa-solid fa-forward-step"></i></div>
      </div>
    </div>

    <!-- BOX 3: MÁY CHỦ DISCORD -->
    <div class="card-box guild-box">
      <div class="guild-left">
        <img class="guild-icon" src="https://cdn.discordapp.com/embed/avatars/1.png" alt="Server Icon">
        <div>
          <div class="guild-name">S3LF VLS</div>
          <div class="guild-stats">
            <span><span class="dot-online"></span> 858 Online</span>
            <span><span class="dot-member"></span> 3,019 Members</span>
          </div>
        </div>
      </div>
      <a href="#" class="join-btn">Join</a>
    </div>

    <!-- LƯỢT XEM -->
    <div class="view-count">
      <i class="fa-regular fa-eye"></i>
      <span>3,152</span>
    </div>

  </div>

  <script>
    const DISCORD_USER_ID = "862273858214821929"; 
    const GITHUB_USER = "DNHA05";
    const GITHUB_REPO = "API-Docs";

    let playlist = [];
    let currentTrack = 0;

    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const nextBtn = document.getElementById('next-btn');
    const playIcon = document.getElementById('play-icon');
    const songTitle = document.getElementById('song-title');
    const statusText = document.getElementById('status-text');

    // TỰ ĐỘNG TÌM BÀI HÁT TRONG THƯ MỤC AUDIO TRÊN GITHUB
    async function loadPlaylistFromGithub() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`);
        const files = await res.json();

        if (Array.isArray(files)) {
          playlist = files
            .filter(file => file.name.endsWith('.mp3'))
            .map(file => ({
              title: file.name.replace('.mp3', ''),
              src: `./audio/${encodeURIComponent(file.name)}`
            }));

          if (playlist.length > 0) {
            loadTrack(currentTrack);
          } else {
            songTitle.innerText = "Không tìm thấy bài hát";
          }
        }
      } catch (err) {
        console.error("Lỗi đọc nhạc:", err);
        songTitle.innerText = "Lỗi kết nối bài hát";
      }
    }

    function loadTrack(index) {
      if (playlist[index]) {
        audio.src = playlist[index].src;
        songTitle.innerText = playlist[index].title;
      }
    }

    function playAudio() {
      if (!playlist.length) return;
      audio.play().then(() => {
        playIcon.className = "fa-solid fa-pause";
        statusText.innerText = "Now playing";
      }).catch(err => console.log("Cần tương tác người dùng:", err));
    }

    function pauseAudio() {
      audio.pause();
      playIcon.className = "fa-solid fa-play";
      statusText.innerText = "Paused";
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) playAudio();
      else pauseAudio();
    });

    nextBtn.addEventListener('click', () => {
      if (!playlist.length) return;
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playAudio();
    });

    audio.addEventListener('ended', () => {
      if (!playlist.length) return;
      currentTrack = (currentTrack + 1) % playlist.length;
      loadTrack(currentTrack);
      playAudio();
    });

    // LẤY DỮ LIỆU DISCORD QUA LANYARD
    async function updateDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await res.json();

        if (result.success && result.data) {
          const user = result.data.discord_user;
          document.getElementById('display-name').innerText = user.global_name || user.username;

          if (user.avatar) {
            const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
            const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
            document.getElementById('discord-avatar').src = avatarUrl;
            document.getElementById('status-avatar').src = avatarUrl;
          }

          if (user.avatar_decoration_data) {
            const deco = document.getElementById('avatar-deco');
            deco.src = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png`;
            deco.style.display = 'block';
          }
        }
      } catch (err) {
        console.error("Lỗi Lanyard API:", err);
      }
    }

    loadPlaylistFromGithub();
    updateDiscordData();
  </script>
</body>
</html>
