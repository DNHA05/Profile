<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* MÀN HÌNH CHÀO (ENTER + MUSIC WILL PLAY) */
    #splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0b0b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      cursor: pointer;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .splash-title {
      font-size: 28px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .splash-subtitle {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    /* BIỂU TƯỢNG (CON MÈO) DI CHUYỂN ĐẾN CHỖ NHẤN */
    #cursor-icon {
      position: fixed;
      width: 40px;
      height: 40px;
      object-fit: contain;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }

    /* VIDEO BACKGROUND CHẠY FULL */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* LỚP PHỦ TỐI MỜ CHO NỀN VIDEO */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
      pointer-events: none;
    }

    body {
      background: #0b0b0b;
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
    }

    .bio-container {
      width: 100%; 
      max-width: 420px;
      background: rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .card-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 14px;
      color: #ffffff; text-decoration: none;
      display: flex; transition: background 0.2s, transform 0.2s;
    }
    .card-box:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-2px);
    }

    /* 1. HEADER PROFILE (BỐ CỤC DỌC - ĐÃ BỎ ICON CẢNH BÁO VÀ HUY HIỆU DƯỚI TÊN) */
    .profile-top {
      position: relative;
      flex-direction: column;
      align-items: flex-start;
      padding: 18px;
    }

    .profile-header-top {
      display: flex;
      align-items: center;
      width: 100%;
      margin-bottom: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 85px;
      height: 85px;
      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.15);
    }

    .avatar-deco {
      position: absolute;
      top: -12%;
      left: -12%;
      width: 124%;
      height: 124%;
      pointer-events: none;
    }

    .display-name { 
      font-size: 24px; 
      font-weight: 800; 
      color: #56e368; 
      min-height: 30px;
      display: flex;
      align-items: center;
      text-shadow: 0 0 8px rgba(86, 227, 104, 0.4);
      margin-bottom: 6px;
    }
    
    .sub-role { 
      font-size: 14px; 
      color: rgba(255, 255, 255, 0.7); 
      font-weight: 500;
      min-height: 20px;
      display: flex;
      align-items: center;
    }
    
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 16px;
      background-color: #56e368;
      margin-left: 2px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* 2. DISCORD USER CARD (ĐÃ BỎ ICON MŨI TÊN BÊN PHẢI) */
    .user-link-box { align-items: center; justify-content: flex-start; gap: 12px; }
    .user-box-left { display: flex; align-items: center; gap: 12px; overflow: hidden; width: 100%; }
    .user-avatar-wrapper { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    .user-mini-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    
    .status-dot {
      position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px;
      border-radius: 50%; border: 3px solid #141414; box-sizing: content-box;
    }
    .status-dot.online { background-color: #23a55a; }
    .status-dot.idle { background-color: #f0b232; }
    .status-dot.dnd { background-color: #f23f43; }
    .status-dot.offline { background-color: #80848e; }

    .user-link-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
    .user-name-row { display: flex; align-items: center; gap: 8px; }
    .user-link-name { font-size: 15px; font-weight: 700; color: #fff; }

    .guild-tag-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 6px; border-radius: 10px; font-size: 11px; font-weight: 700;
      color: #ffffff; line-height: 1;
    }
    .guild-tag-badge img { width: 12px; height: 12px; object-fit: contain; }

    .user-link-status { font-size: 12px; color: #56e368; font-style: italic; }

    /* 3. DISCORD SERVER CARD */
    .guild-box { align-items: center; justify-content: space-between; gap: 10px; }
    .guild-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .guild-icon { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; background: #111; flex-shrink: 0; }
    .guild-name { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .guild-stats { font-size: 11px; color: rgba(255, 255, 255, 0.6); display: flex; gap: 8px; align-items: center; margin-top: 2px; }
    .dot-online { display: inline-block; width: 6px; height: 6px; background-color: #23a55a; border-radius: 50%; }
    .dot-member { display: inline-block; width: 6px; height: 6px; background-color: #80848e; border-radius: 50%; }
    
    .join-btn {
      background: rgba(255, 255, 255, 0.1); color: #fff; font-size: 12px; font-weight: 600;
      padding: 6px 14px; border-radius: 10px; transition: background 0.2s; flex-shrink: 0;
    }
    .join-btn:hover { background: rgba(255, 255, 255, 0.2); }

    /* BOTTOM ROW: SOCIALS & VIEW COUNT */
    .bottom-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
    }

    .social-icons {
      display: flex;
      gap: 8px;
    }

    .social-btn {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 15px;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .social-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }

    .view-count { display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255, 255, 255, 0.7); font-weight: 600; }
    .view-count i { color: #2ecc71; }
  </style>
</head>
<body>

  <!-- MÀN HÌNH CHÀO (ENTER + MUSIC WILL PLAY) -->
  <div id="splash-screen" onclick="enterSite()">
    <div class="splash-content">
      <div class="splash-title">Enter</div>
      <div class="splash-subtitle">Music will play</div>
    </div>
  </div>

  <!-- VIDEO NỀN -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="./carx-edited_by_cut3.mp4" type="video/mp4">
  </video>

  <!-- NHẠC NỀN AUDIO CHẠY NGẦM -->
  <audio id="bg-audio" loop preload="auto">
    <source src="./nhac.mp3" type="audio/mp3">
  </audio>

  <!-- BIỂU TƯỢNG (CON MÈO) DI CHUYỂN ĐẾN CHỖ NHẤN -->
  <img id="cursor-icon" src="./cat.png" alt="Icon">

  <div class="bio-container">
    
    <!-- 1. HEADER PROFILE (ĐÃ BỎ ICON CẢNH BÁO & HUY HIỆU) -->
    <div class="card-box profile-top">
      <div class="profile-header-top">
        <div class="avatar-wrapper">
          <img id="avatar-deco" class="avatar-deco" style="display:none;" alt="Decoration">
          <img id="discord-avatar" class="avatar-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
        </div>
      </div>
      <div>
        <div class="display-name">
          <span id="typed-name"></span><span class="typing-cursor"></span>
        </div>
        <div class="sub-role">
          <span id="typed-role"></span>
        </div>
      </div>
    </div>

    <!-- 2. KHUNG DISCORD CÁ NHÂN (ĐÃ BỎ MŨI TÊN BÊN PHẢI) -->
    <a id="discord-user-link" href="https://discord.com/users/862273858214821929" target="_blank" class="card-box user-link-box">
      <div class="user-box-left">
        <div class="user-avatar-wrapper">
          <img id="mini-avatar" class="user-mini-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Mini Avatar">
          <div id="status-dot" class="status-dot offline"></div>
        </div>
        <div class="user-link-info">
          <div class="user-name-row">
            <span id="user-link-name" class="user-link-name">_harblx</span>
            <div class="guild-tag-badge">
              <img src="https://cdn3.emoji.gg/emojis/68950-purple-heart.gif" alt="badge">
              <span>OwO</span>
            </div>
          </div>
          <div id="user-link-status" class="user-link-status">last seen 5 minutes ago</div>
        </div>
      </div>
    </a>

    <!-- 3. KHUNG MÁY CHỦ DISCORD (SERVER) -->
    <a id="guild-link" href="#" target="_blank" class="card-box guild-box">
      <div class="guild-left">
        <img id="guild-icon" class="guild-icon" src="https://cdn.discordapp.com/embed/avatars/1.png" alt="Server Icon">
        <div>
          <div id="guild-name" class="guild-name">Loading Server...</div>
          <div class="guild-stats">
            <span><span class="dot-online"></span> <span id="guild-online">0</span> Online</span>
            <span><span class="dot-member"></span> <span id="guild-members">0</span> Members</span>
          </div>
        </div>
      </div>
      <div class="join-btn">Join</div>
    </a>

    <!-- 4. THANH MẠNG XÃ HỘI & VIEW -->
    <div class="bottom-row">
      <div class="social-icons">
        <a href="#" class="social-btn" target="_blank"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" class="social-btn" target="_blank"><i class="fa-brands fa-discord"></i></a>
        <a href="#" class="social-btn" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
        <a href="#" class="social-btn" target="_blank"><i class="fa-brands fa-steam"></i></a>
        <a href="#" class="social-btn" target="_blank"><i class="fa-brands fa-guilded"></i></a>
      </div>
      <div class="view-count">
        <i class="fa-regular fa-eye"></i>
        <span>461</span>
      </div>
    </div>

  </div>

  <script>
    const DISCORD_USER_ID = "862273858214821929"; 
    const DISCORD_INVITE_CODE = "XEaC68tVnv"; 

    function enterSite() {
      const splash = document.getElementById('splash-screen');
      const bgAudio = document.getElementById('bg-audio');
      const video = document.getElementById('bg-video');

      if (splash) {
        splash.classList.add('hidden');
      }
      if (bgAudio) {
        bgAudio.play().catch(err => console.log("Không phát được nhạc:", err));
      }
      if (video) {
        video.play().catch(err => console.log("Không phát được video:", err));
      }
    }

    // DI CHUYỂN BIỂU TƯỢNG (CON MÈO) ĐẾN NƠI NHẤP CHUỘT
    window.addEventListener('click', (e) => {
      const splash = document.getElementById('splash-screen');
      if (splash && !splash.classList.contains('hidden')) return;

      const cursorIcon = document.getElementById('cursor-icon');
      cursorIcon.style.left = `${e.clientX}px`;
      cursorIcon.style.top = `${e.clientY}px`;
    });

    // 1. HIỆU ỨNG GÕ CHỮ CHO TÊN CHÍNH
    const nameWords = ["Hanh Lẻ"];
    let nameWordIndex = 0;
    let nameCharIndex = 0;
    let nameIsDeleting = false;
    const typedNameSpan = document.getElementById("typed-name");

    function typeNameEffect() {
      const currentWord = nameWords[nameWordIndex];
      
      if (nameIsDeleting) {
        typedNameSpan.textContent = currentWord.substring(0, nameCharIndex - 1);
        nameCharIndex--;
      } else {
        typedNameSpan.textContent = currentWord.substring(0, nameCharIndex + 1);
        nameCharIndex++;
      }

      let typeSpeed = nameIsDeleting ? 70 : 120;

      if (!nameIsDeleting && nameCharIndex === currentWord.length) {
        typeSpeed = 2000; 
        nameIsDeleting = true;
      } else if (nameIsDeleting && nameCharIndex === 0) {
        nameIsDeleting = false;
        nameWordIndex = (nameWordIndex + 1) % nameWords.length;
        typeSpeed = 500; 
      }

      setTimeout(typeNameEffect, typeSpeed);
    }

    // 2. HIỆU ỨNG GÕ CHỮ CHO SUB-ROLE
    const roleWords = ["Dev", "Code Website", "Welcome to my Bio"];
    let roleWordIndex = 0;
    let roleCharIndex = 0;
    let roleIsDeleting = false;
    const typedRoleSpan = document.getElementById("typed-role");

    function typeRoleEffect() {
      const currentWord = roleWords[roleWordIndex];
      
      if (roleIsDeleting) {
        typedRoleSpan.textContent = currentWord.substring(0, roleCharIndex - 1);
        roleCharIndex--;
      } else {
        typedRoleSpan.textContent = currentWord.substring(0, roleCharIndex + 1);
        roleCharIndex++;
      }

      let typeSpeed = roleIsDeleting ? 50 : 90;

      if (!roleIsDeleting && roleCharIndex === currentWord.length) {
        typeSpeed = 2000; 
        roleIsDeleting = true;
      } else if (roleIsDeleting && roleCharIndex === 0) {
        roleIsDeleting = false;
        roleWordIndex = (roleWordIndex + 1) % roleWords.length;
        typeSpeed = 400; 
      }

      setTimeout(typeRoleEffect, typeSpeed);
    }

    document.addEventListener("DOMContentLoaded", () => {
      setTimeout(typeNameEffect, 500);
      setTimeout(typeRoleEffect, 800);
    });

    async function updateDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await res.json();

        if (result.success && result.data) {
          const data = result.data;
          const user = data.discord_user;
          const status = data.discord_status;

          document.getElementById('user-link-name').innerText = user.username;

          if (user.avatar) {
            const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
            const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
            document.getElementById('discord-avatar').src = avatarUrl;
            document.getElementById('mini-avatar').src = avatarUrl;
          }

          if (user.avatar_decoration_data) {
            const deco = document.getElementById('avatar-deco');
            deco.src = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png`;
            deco.style.display = 'block';
          }

          document.getElementById('status-dot').className = `status-dot ${status}`;
        }
      } catch (err) { console.error("Lỗi API User:", err); }
    }

    async function updateServerData() {
      try {
        const res = await fetch(`https://discord.com/api/v9/invites/${DISCORD_INVITE_CODE}?with_counts=true`);
        const data = await res.json();
        if (data && data.guild) {
          document.getElementById('guild-link').href = `https://discord.gg/${DISCORD_INVITE_CODE}`;
          document.getElementById('guild-name').innerText = data.guild.name;
          document.getElementById('guild-online').innerText = data.approximate_presence_count.toLocaleString();
          document.getElementById('guild-members').innerText = data.approximate_member_count.toLocaleString();
          if (data.guild.icon) {
            const ext = data.guild.icon.startsWith('a_') ? 'gif' : 'png';
            document.getElementById('guild-icon').src = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.${ext}?size=128`;
          }
        }
      } catch (err) { console.error("Lỗi API Server:", err); }
    }

    updateDiscordData();
    updateServerData();
    setInterval(updateDiscordData, 30000);
  </script>
</body>
</html>
