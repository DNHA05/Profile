<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background: #000 url('./banner.gif') center/cover no-repeat fixed;
      color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    .bio-container {
      width: 100%; max-width: 380px;
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 12px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    /* ĐỊNH DẠNG KHUNG DẠNG LINK BLOCK */
    .card-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 14px;
      color: #ffffff; text-decoration: none;
      display: flex; transition: background 0.2s, transform 0.2s;
    }
    .card-box:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-2px);
    }

    /* 1. KHUNG TOP (HEADER PROFILE) */
    .profile-top { display: flex; align-items: center; gap: 14px; }
    .avatar-wrapper { position: relative; width: 75px; height: 75px; flex-shrink: 0; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .avatar-deco { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; pointer-events: none; }
    .display-name { font-size: 22px; font-weight: 800; color: #fff; }
    .badges-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .badge-icon { font-size: 13px; color: rgba(255, 255, 255, 0.8); }
    .sub-role { font-size: 13px; color: rgba(255, 255, 255, 0.7); font-weight: 500; }

    /* 2. KHUNG LINK DISCORD CÁ NHÂN */
    .user-link-box { align-items: center; gap: 12px; }
    .user-mini-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .user-link-info { display: flex; flex-direction: column; gap: 2px; }
    .user-link-name { font-size: 14px; font-weight: 700; }
    .user-link-status { font-size: 12px; color: rgba(255, 255, 255, 0.5); font-style: italic; }

    /* 3. KHUNG LINK MÁY CHỦ DISCORD */
    .guild-box { align-items: center; justify-content: space-between; gap: 10px; }
    .guild-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .guild-icon { width: 46px; height: 46px; border-radius: 14px; background: #000; object-fit: cover; flex-shrink: 0; }
    .guild-name { font-size: 14px; font-weight: 800; }
    .guild-stats { font-size: 11px; color: rgba(255, 255, 255, 0.6); display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .dot-online { width: 6px; height: 6px; background: #23a55a; border-radius: 50%; display: inline-block; }
    .dot-member { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; display: inline-block; }

    .join-btn {
      background: #23a55a; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
      padding: 6px 14px; border-radius: 8px; flex-shrink: 0; transition: background 0.2s;
    }
    .join-btn:hover { background: #1f924e; }

    /* VIEW COUNT FOOTER */
    .view-count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.7); font-weight: 600; padding: 2px 6px; }
  </style>
</head>
<body>

  <audio id="audio-player" autoplay loop></audio>

  <div class="bio-container">
    
    <!-- KHUNG HEADER PROFILE -->
    <div class="card-box profile-top">
      <div class="avatar-wrapper">
        <img id="avatar-deco" class="avatar-deco" style="display:none;" alt="Decoration">
        <img id="discord-avatar" class="avatar-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
      </div>
      <div>
        <div id="display-name" class="display-name">Loading...</div>
        <div class="badges-row">
          <i class="fa-solid fa-bug badge-icon" style="color: #23a55a;"></i>
          <i class="fa-solid fa-gem badge-icon" style="color: #9b59b6;"></i>
          <i class="fa-solid fa-star badge-icon" style="color: #2ecc71;"></i>
          <i class="fa-solid fa-rocket badge-icon" style="color: #e74c3c;"></i>
          <i class="fa-solid fa-shield-halved badge-icon" style="color: #e67e22;"></i>
        </div>
        <div class="sub-role">Helper @sel</div>
      </div>
    </div>

    <!-- KHUNG TRÊN: LINK DISCORD CÁ NHÂN -->
    <a id="discord-user-link" href="https://discord.com/users/862273858214821929" target="_blank" class="card-box user-link-box">
      <img id="mini-avatar" class="user-mini-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Mini Avatar">
      <div class="user-link-info">
        <div id="user-link-name" class="user-link-name">Loading...</div>
        <div id="user-link-status" class="user-link-status">Fetching status...</div>
      </div>
    </a>

    <!-- KHUNG DƯỚI: LINK MÁY CHỦ DISCORD (THAY LINK SERVER CỦA BẠN VÀO HREF) -->
    <a href="https://discord.gg/your-invite-code" target="_blank" class="card-box guild-box">
      <div class="guild-left">
        <!-- Thay link logo server của bạn vào src -->
        <img class="guild-icon" src="https://cdn.discordapp.com/embed/avatars/1.png" alt="Server Icon">
        <div>
          <!-- Thay tên Server của bạn tại đây -->
          <div class="guild-name">S3LF VLS</div>
          <div class="guild-stats">
            <span><span class="dot-online"></span> 858 Online</span>
            <span><span class="dot-member"></span> 3,019 Members</span>
          </div>
        </div>
      </div>
      <div class="join-btn">Join</div>
    </a>

    <!-- LƯỢT XEM -->
    <div class="view-count">
      <i class="fa-regular fa-eye"></i>
      <span>3,152</span>
    </div>

  </div>

  <script>
    const DISCORD_USER_ID = "862273858214821929"; 
    const GITHUB_USER = "DNHA05";
    const GITHUB_REPO = "API-Docs";

    // PHÁT NHẠC TỰ ĐỘNG TỪ FOLDER GITHUB
    async function initMusic() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`);
        const files = await res.json();
        if (Array.isArray(files) && files.length > 0) {
          const mp3Files = files.filter(f => f.name.endsWith('.mp3'));
          if (mp3Files.length > 0) {
            const audio = document.getElementById('audio-player');
            audio.src = `./audio/${encodeURIComponent(mp3Files[0].name)}`;
          }
        }
      } catch (err) {
        console.error("Lỗi tải nhạc:", err);
      }
    }

    // TẢI DỮ LIỆU DISCORD CÁ NHÂN (AVATAR, TÊN, TRẠNG THÁI)
    async function updateDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await res.json();

        if (result.success && result.data) {
          const user = result.data.discord_user;
          const status = result.data.discord_status;
          const name = user.global_name || user.username;

          // Cập nhật tên
          document.getElementById('display-name').innerText = name;
          document.getElementById('user-link-name').innerText = user.username;

          // Cập nhật Avatar
          if (user.avatar) {
            const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
            const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
            document.getElementById('discord-avatar').src = avatarUrl;
            document.getElementById('mini-avatar').src = avatarUrl;
          }

          // Cập nhật Trang trí Avatar (nếu có)
          if (user.avatar_decoration_data) {
            const deco = document.getElementById('avatar-deco');
            deco.src = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png`;
            deco.style.display = 'block';
          }

          // Cập nhật chữ trạng thái ở khung liên kết cá nhân
          const statusElem = document.getElementById('user-link-status');
          if (status === 'online') statusElem.innerText = 'Online now';
          else if (status === 'dnd') statusElem.innerText = 'Do Not Disturb';
          else if (status === 'idle') statusElem.innerText = 'Idle';
          else statusElem.innerText = 'last seen recently';
        }
      } catch (err) {
        console.error("Lỗi API Discord:", err);
      }
    }

    initMusic();
    updateDiscordData();
  </script>
</body>
</html>
