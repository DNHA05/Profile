<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>guns.lol Bio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* VIDEO BACKGROUND CHẠY FULL VÀ LẶP LẠI (TẮT TIẾNG ĐỂ VIDEO LUÔN CHẠY MƯỢT) */
    #bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
    }

    /* LỚP PHỦ TỐI MỜ CHO NỀN VIDEO */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: -1;
      pointer-events: none;
    }

    body {
      background: transparent;
      color: #ffffff; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 20px;
      overflow-x: hidden;
    }

    /* NÚT THÔNG BÁO BẬT NHẠC (Ẩn đi sau khi click) */
    #music-prompt {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      z-index: 999;
      cursor: pointer;
      backdrop-filter: blur(10px);
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translate(-50%, 0); }
      50% { transform: translate(-50%, -5px); }
    }

    .bio-container {
      width: 100%; 
      max-width: 420px;
      background: rgba(20, 20, 20, 0.5);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      gap: 12px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
    }

    .card-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px; padding: 14px;
      color: #ffffff; text-decoration: none;
      display: flex; transition: background 0.2s, transform 0.2s;
    }
    .card-box:hover {
      background: rgba(255, 255, 255, 0.09);
      transform: translateY(-2px);
    }

    /* 1. HEADER PROFILE */
    .profile-top { display: flex; align-items: center; gap: 14px; }
    .avatar-wrapper { position: relative; width: 75px; height: 75px; flex-shrink: 0; }
    .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .avatar-deco { position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; pointer-events: none; }
    .display-name { font-size: 22px; font-weight: 800; color: #fff; }
    .badges-row { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .badge-icon { font-size: 13px; color: rgba(255, 255, 255, 0.8); }
    .sub-role { font-size: 13px; color: rgba(255, 255, 255, 0.7); font-weight: 500; }

    /* 2. DISCORD USER CARD */
    .user-link-box { align-items: center; gap: 12px; }
    .user-avatar-wrapper { position: relative; width: 44px; height: 44px; flex-shrink: 0; }
    .user-mini-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    
    .status-dot {
      position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px;
      border-radius: 50%; border: 3px solid #141414; box-sizing: content-box;
    }
    .status-dot.online { background-color: #23a55a; }
    .status-dot.idle { 
      background-color: #f0b232; 
      -webkit-mask: radial-gradient(circle at 30% 30%, transparent 45%, #000 46%);
      mask: radial-gradient(circle at 30% 30%, transparent 45%, #000 46%);
    }
    .status-dot.dnd { background-color: #f23f43; position: absolute; }
    .status-dot.dnd::after {
      content: ""; position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 8px; height: 2px;
      background-color: #141414; border-radius: 1px;
    }
    .status-dot.offline, .status-dot.invisible { 
      background-color: #80848e; 
      -webkit-mask: radial-gradient(circle, transparent 35%, #000 36%);
      mask: radial-gradient(circle, transparent 35%, #000 36%);
    }

    .user-link-info { display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
    .user-name-row { display: flex; align-items: center; gap: 8px; }
    .user-link-name { font-size: 15px; font-weight: 700; color: #56e368; }

    .guild-tag-badge {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255, 255, 255, 0.12); border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: 700;
      color: #ffffff; line-height: 1;
    }
    .guild-tag-badge img { width: 14px; height: 14px; object-fit: contain; }

    .user-link-status { 
      font-size: 13px; color: #56e368; display: flex; align-items: center; gap: 6px; 
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .user-link-status.offline-text { font-style: italic; opacity: 0.8; }
    .status-emoji { width: 16px; height: 16px; object-fit: contain; }

    /* 3. DISCORD SERVER CARD */
    .guild-box { align-items: center; justify-content: space-between; gap: 10px; }
    .guild-left { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .guild-icon { width: 46px; height: 46px; border-radius: 14px; background: #111; object-fit: cover; flex-shrink: 0; }
    .guild-name { font-size: 14px; font-weight: 800; }
    .guild-stats { font-size: 11px; color: rgba(255, 255, 255, 0.6); display: flex; align-items: center; gap: 8px; margin-top: 3px; }
    .dot-online { width: 6px; height: 6px; background: #23a55a; border-radius: 50%; display: inline-block; }
    .dot-member { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.4); border-radius: 50%; display: inline-block; }

    .join-btn {
      background: #23a55a; color: #fff; text-decoration: none; font-size: 12px; font-weight: 700;
      padding: 6px 14px; border-radius: 8px; flex-shrink: 0; transition: background 0.2s;
    }
    .join-btn:hover { background: #1f924e; }

    .view-count { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.7); font-weight: 600; padding: 2px 6px; }
  </style>
</head>
<body>

  <!-- NÚT GỢI Ý CLICK ĐỂ PHÁT NHẠC (Do trình duyệt chặn tự động phát âm thanh) -->
  <div id="music-prompt">🔊 Click vào đây để bật nhạc nền</div>

  <!-- VIDEO NỀN -->
  <video autoplay muted loop playsinline id="bg-video">
    <source src="./carx-edited_by_cut3.mp4" type="video/mp4">
  </video>

  <!-- THẺ AUDIO PHÁT NHẠC LẶP LẠI -->
  <audio id="audio-player" loop></audio>

  <div class="bio-container">
    
    <!-- HEADER PROFILE -->
    <div class="card-box profile-top">
      <div class="avatar-wrapper">
        <img id="avatar-deco" class="avatar-deco" style="display:none;" alt="Decoration">
        <img id="discord-avatar" class="avatar-img" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar">
      </div>
      <div>
        <div id="display-name" class="display-name">Loading...</div>
        <div class="badges-row">
          <i class="fa-solid fa-bug badge-icon" style="color: #23a55a;"></i>
          <i class="fa-solid fa-gem badge-icon" style="color: #9b59b6;"></i>
          <i class="fa-solid fa-star badge-icon" style="color: #2ecc71;"></i>
          <i class="fa-solid fa-rocket badge-icon" style="color: #e74c3c;"></i>
          <i class="fa-solid fa-shield-halved badge-icon" style="color: #e67e22;"></i>
        </div>
        <div class="sub-role">Helper @sel</div>
      </div>
    </div>

    <!-- KHUNG DISCORD CÁ NHÂN -->
    <a id="discord-user-link" href="https://discord.com/users/862273858214821929" target="_blank" class="card-box user-link-box">
      <div class="user-avatar-wrapper">
        <img id="mini-avatar" class="user-mini-avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Mini Avatar">
        <div id="status-dot" class="status-dot offline"></div>
      </div>
      
      <div class="user-link-info">
        <div class="user-name-row">
          <span id="user-link-name" class="user-link-name">Loading...</span>
          <div class="guild-tag-badge">
            <img src="https://cdn3.emoji.gg/emojis/68950-purple-heart.gif" alt="badge">
            <span>OwO</span>
          </div>
        </div>
        <div id="user-link-status" class="user-link-status">Fetching status...</div>
      </div>
    </a>

    <!-- KHUNG MÁY CHỦ DISCORD -->
    <a id="guild-link" href="#" target="_blank" class="card-box guild-box">
      <div class="guild-left">
        <img id="guild-icon" class="guild-icon" src="https://cdn.discordapp.com/embed/avatars/1.png" alt="Server Icon">
        <div>
          <div id="guild-name" class="guild-name">Loading Server...</div>
          <div class="guild-stats">
            <span><span class="dot-online"></span> <span id="guild-online">0</span> Online</span>
            <span><span class="dot-member"></span> <span id="guild-members">0</span> Members</span>
          </div>
        </div>
      </div>
      <div class="join-btn">Join</div>
    </a>

    <!-- VIEW COUNT -->
    <div class="view-count">
      <i class="fa-regular fa-eye"></i>
      <span>3,152</span>
    </div>

  </div>

  <script>
    const DISCORD_USER_ID = "862273858214821929"; 
    const DISCORD_INVITE_CODE = "XEaC68tVnv"; 
    
    const GITHUB_USER = "DNHA05";
    const GITHUB_REPO = "API-Docs";

    let offlineTimestamp = null;
    let timerInterval = null;

    // Tự động lấy file nhạc .mp3 từ thư mục audio trên GitHub của bạn
    async function initMusic() {
      try {
        const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/audio`);
        const files = await res.json();
        if (Array.isArray(files) && files.length > 0) {
          const mp3Files = files.filter(f => f.name.endsWith('.mp3'));
          if (mp3Files.length > 0) {
            document.getElementById('audio-player').src = `./audio/${encodeURIComponent(mp3Files[0].name)}`;
          }
        }
      } catch (err) { console.error("Lỗi tải nhạc:", err); }
    }

    function formatLastSeen(ts) {
      if (!ts) return "last seen recently";
      const diffSec = Math.floor((Date.now() - ts) / 1000);
      if (diffSec < 60) return "last seen just now";
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `last seen ${mins} minute${mins > 1 ? 's' : ''} ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `last seen ${hours} hour${hours > 1 ? 's' : ''} ago`;
      const days = Math.floor(hours / 24);
      return `last seen ${days} day${days > 1 ? 's' : ''} ago`;
    }

    async function updateDiscordData() {
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`);
        const result = await res.json();

        if (result.success && result.data) {
          const data = result.data;
          const user = data.discord_user;
          const status = data.discord_status;
          const name = user.global_name || user.username;

          document.getElementById('display-name').innerText = name;
          document.getElementById('user-link-name').innerText = user.username;

          if (user.avatar) {
            const ext = user.avatar.startsWith('a_') ? 'gif' : 'png';
            const avatarUrl = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
            document.getElementById('discord-avatar').src = avatarUrl;
            document.getElementById('mini-avatar').src = avatarUrl;
          }

          if (user.avatar_decoration_data) {
            const deco = document.getElementById('avatar-deco');
            deco.src = `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png`;
            deco.style.display = 'block';
          }

          document.getElementById('status-dot').className = `status-dot ${status}`;

          const statusElem = document.getElementById('user-link-status');

          if (status === 'offline') {
            statusElem.classList.add('offline-text');

            let savedOfflineTime = localStorage.getItem('discord_offline_time');
            if (!savedOfflineTime) {
              savedOfflineTime = Date.now();
              localStorage.setItem('discord_offline_time', savedOfflineTime);
            }

            offlineTimestamp = parseInt(savedOfflineTime);

            if (timerInterval) clearInterval(timerInterval);
            statusElem.innerText = formatLastSeen(offlineTimestamp);
            timerInterval = setInterval(() => { 
              statusElem.innerText = formatLastSeen(offlineTimestamp); 
            }, 10000);

          } else {
            localStorage.removeItem('discord_offline_time');
            statusElem.classList.remove('offline-text');
            offlineTimestamp = null;
            if (timerInterval) clearInterval(timerInterval);

            const customActivity = data.activities?.find(a => a.type === 4);

            if (customActivity && (customActivity.state || customActivity.emoji)) {
              let statusHTML = '';
              if (customActivity.emoji) {
                if (customActivity.emoji.id) {
                  const ext = customActivity.emoji.animated ? 'gif' : 'png';
                  statusHTML += `<img class="status-emoji" src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.${ext}"> `;
                } else { 
                  statusHTML += `${customActivity.emoji.name} `; 
                }
              }
              if (customActivity.state) statusHTML += customActivity.state;
              statusElem.innerHTML = statusHTML;
            } else {
              const statusTextMap = { 'dnd': 'Do Not Disturb', 'idle': 'Idle', 'online': 'Online now' };
              statusElem.innerText = statusTextMap[status] || 'Online now';
            }
          }
        }
      } catch (err) { console.error("Lỗi API User:", err); }
    }

    async function updateServerData() {
      try {
        const res = await fetch(`https://discord.com/api/v9/invites/${DISCORD_INVITE_CODE}?with_counts=true`);
        const data = await res.json();
        if (data && data.guild) {
          document.getElementById('guild-link').href = `https://discord.gg/${DISCORD_INVITE_CODE}`;
          document.getElementById('guild-name').innerText = data.guild.name;
          document.getElementById('guild-online').innerText = data.approximate_presence_count.toLocaleString();
          document.getElementById('guild-members').innerText = data.approximate_member_count.toLocaleString();
          if (data.guild.icon) {
            const ext = data.guild.icon.startsWith('a_') ? 'gif' : 'png';
            document.getElementById('guild-icon').src = `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.${ext}?size=128`;
          }
        }
      } catch (err) { console.error("Lỗi API Server:", err); }
    }

    initMusic();
    updateDiscordData();
    updateServerData();
    setInterval(updateDiscordData, 30000);

    // Kích hoạt phát nhạc và ẩn nút thông báo khi người dùng click vào trang
    window.addEventListener('click', () => {
      const audio = document.getElementById('audio-player');
      if (audio.paused) {
        audio.play().catch(e => console.log(e));
      }
      const prompt = document.getElementById('music-prompt');
      if (prompt) prompt.style.display = 'none';
    }, { once: true });
  </script>
</body>
</html>
