<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>guns.lol Bio</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* =========================
       SPLASH SCREEN
       ========================= */

    #splash-screen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;

      background: #0b0b0b;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      z-index: 9999;
      cursor: pointer;

      transition:
        opacity 0.6s ease,
        visibility 0.6s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .splash-title {
      font-size: 28px;
      font-weight: 600;
      color: #fff;
    }

    .splash-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,.5);
    }

    /* =========================
       CLICK EFFECT
       ========================= */

    .click-text-effect {
      position: fixed;

      font-size: 14px;
      font-weight: 700;

      color: #56e368;

      text-shadow:
        0 0 8px rgba(86,227,104,.6);

      pointer-events: none;
      user-select: none;

      z-index: 10000;

      animation: floatUpFade .8s ease-out forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 1;
        transform:
          translate(-50%,-50%)
          scale(.8);
      }

      100% {
        opacity: 0;
        transform:
          translate(-50%,-120%)
          scale(1.2);
      }
    }

    /* =========================
       VIDEO BACKGROUND
       ========================= */

    #bg-video {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      object-fit: cover;

      z-index: -2;
    }

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(0,0,0,.4);

      z-index: -1;

      pointer-events: none;
    }

    body {
      background: #0b0b0b;
      color: #fff;

      display: flex;

      justify-content: center;
      align-items: center;

      padding: 20px;

      min-height: 100vh;
    }

    /* =========================
       MAIN CONTAINER
       ========================= */

    .bio-container {
      width: 100%;
      max-width: 720px;

      background: rgba(20,20,20,.5);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      border:
        1px solid rgba(255,255,255,.12);

      border-radius: 28px;

      padding: 20px;

      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      box-shadow:
        0 30px 60px rgba(0,0,0,.8);
    }

    /* =========================
       CARD
       ========================= */

    .card-box {
      background:
        rgba(255,255,255,.05);

      border:
        1px solid rgba(255,255,255,.08);

      border-radius: 20px;

      padding: 14px;

      color: #fff;

      text-decoration: none;

      display: flex;

      transition:
        background .2s,
        transform .2s;
    }

    .card-box:hover {
      background:
        rgba(255,255,255,.09);

      transform:
        translateY(-2px);
    }

    /* ==================================================
       PROFILE TOP
       
       ĐÃ BỎ KHUNG / BO VIỀN / NỀN
       ================================================== */

    .profile-top {
      grid-column: 1 / -1;

      display: flex;

      align-items: center;

      gap: 14px;

      /* BỎ KHUNG */
      background: transparent !important;

      border: none !important;

      border-radius: 0 !important;

      box-shadow: none !important;

      padding: 0 !important;

      transform: none !important;
    }

    .profile-top:hover {
      background: transparent !important;

      transform: none !important;
    }

    /* =========================
       AVATAR
       ========================= */

    .avatar-wrapper {
      position: relative;

      width: 75px;
      height: 75px;

      flex-shrink: 0;
    }

    .avatar-img {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;
    }

    .avatar-deco {
      position: absolute;

      top: -10%;
      left: -10%;

      width: 120%;
      height: 120%;

      pointer-events: none;
    }

    /* =========================
       NAME
       ========================= */

    .display-name {
      font-size: 22px;

      font-weight: 800;

      color: #fff;

      min-height: 28px;

      display: flex;

      align-items: center;
    }

    /* =========================
       BADGES
       ========================= */

    .badges-row {
      display: flex;

      align-items: center;

      justify-content: flex-start;

      gap: 3px;

      width: fit-content;

      padding: 3px 7px;

      margin-top: 3px;

      border:
        1px solid rgba(255,255,255,.22);

      border-radius: 999px;

      background:
        rgba(255,255,255,.07);

      box-shadow:
        0 2px 8px rgba(0,0,0,.25);
    }

    .badge-icon {
      width: 14px;
      height: 14px;

      object-fit: contain;

      display: block;

      flex-shrink: 0;
    }

    /* =========================
       SUB ROLE
       ========================= */

    .sub-role {
      font-size: 13px;

      color:
        rgba(255,255,255,.7);

      font-weight: 500;

      min-height: 18px;

      display: flex;

      align-items: center;
    }

    .typing-cursor {
      display: inline-block;

      width: 2px;
      height: 16px;

      background: #fff;

      margin-left: 4px;

      animation: blink .8s infinite;
    }

    @keyframes blink {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0;
      }
    }

    /* =========================
       DISCORD USER
       ========================= */

    .user-link-box {
      align-items: center;

      gap: 12px;
    }

    .user-avatar-wrapper {
      position: relative;

      width: 44px;
      height: 44px;

      flex-shrink: 0;
    }

    .user-mini-avatar {
      width: 100%;
      height: 100%;

      border-radius: 50%;

      object-fit: cover;
    }

    /* =========================
       STATUS
       ========================= */

    .status-dot {
      position: absolute;

      bottom: -2px;
      right: -2px;

      width: 14px;
      height: 14px;

      border-radius: 50%;

      border:
        3px solid #141414;

      box-sizing: content-box;
    }

    .status-dot.online {
      background: #23a55a;
    }

    .status-dot.idle {
      background: #f0b232;

      -webkit-mask:
        radial-gradient(
          circle at 30% 30%,
          transparent 45%,
          #000 46%
        );

      mask:
        radial-gradient(
          circle at 30% 30%,
          transparent 45%,
          #000 46%
        );
    }

    .status-dot.dnd {
      background: #f23f43;
    }

    .status-dot.dnd::after {
      content: "";

      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%,-50%);

      width: 8px;
      height: 2px;

      background: #141414;

      border-radius: 1px;
    }

    .status-dot.offline,
    .status-dot.invisible {
      background: #80848e;

      -webkit-mask:
        radial-gradient(
          circle,
          transparent 35%,
          #000 36%
        );

      mask:
        radial-gradient(
          circle,
          transparent 35%,
          #000 36%
        );
    }

    /* =========================
       USER INFO
       ========================= */

    .user-link-info {
      display: flex;

      flex-direction: column;

      gap: 4px;

      overflow: hidden;
    }

    .user-name-row {
      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;
    }

    .user-link-name {
      font-size: 15px;

      font-weight: 700;

      color: #56e368;
    }

    .guild-tag-badge {
      display: inline-flex;

      align-items: center;

      gap: 5px;

      background:
        rgba(255,255,255,.12);

      border:
        1px solid rgba(255,255,255,.08);

      padding: 3px 8px;

      border-radius: 12px;

      font-size: 12px;

      font-weight: 700;

      color: #fff;

      line-height: 1;
    }

    .guild-tag-badge img {
      width: 14px;
      height: 14px;

      object-fit: contain;
    }

    .user-link-status {
      font-size: 13px;

      color: #56e368;

      display: flex;

      align-items: center;

      gap: 6px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .user-link-status.offline-text {
      font-style: italic;

      opacity: .8;
    }

    .status-emoji {
      width: 16px;
      height: 16px;

      object-fit: contain;
    }

    /* =========================
       SERVER
       ========================= */

    .guild-box {
      align-items: center;

      justify-content: space-between;

      gap: 10px;
    }

    .guild-left {
      display: flex;

      align-items: center;

      gap: 12px;

      overflow: hidden;
    }

    .guild-icon {
      width: 46px;
      height: 46px;

      border-radius: 14px;

      background: #111;

      object-fit: cover;

      flex-shrink: 0;
    }

    .guild-name {
      font-size: 14px;

      font-weight: 800;
    }

    .guild-stats {
      font-size: 11px;

      color:
        rgba(255,255,255,.6);

      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 3px;
    }

    .dot-online {
      width: 6px;
      height: 6px;

      background: #23a55a;

      border-radius: 50%;

      display: inline-block;
    }

    .dot-member {
      width: 6px;
      height: 6px;

      background:
        rgba(255,255,255,.4);

      border-radius: 50%;

      display: inline-block;
    }

    .join-btn {
      background: #23a55a;

      color: #fff;

      font-size: 12px;

      font-weight: 700;

      padding: 6px 14px;

      border-radius: 8px;

      flex-shrink: 0;

      transition:
        background .2s;
    }

    .join-btn:hover {
      background: #1f924e;
    }

    /* =========================
       SOCIAL
       LUÔN CHÍNH GIỮA
       ========================= */

    .social-links {
      grid-column: 1 / -1;

      width: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin: 0 auto;

      padding: 2px 0;
    }

    .social-icon {
      width: 42px;
      height: 42px;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,.06);

      border:
        1px solid rgba(255,255,255,.15);

      border-radius: 12px;

      text-decoration: none;

      transition:
        transform .2s ease,
        background .2s ease,
        border-color .2s ease;
    }

    .social-icon img {
      width: 25px;
      height: 25px;

      object-fit: contain;

      display: block;
    }

    .social-icon:hover {
      transform:
        translateY(-3px);

      background:
        rgba(255,255,255,.12);

      border-color:
        rgba(255,255,255,.3);
    }

    /* =========================
       VIEW COUNT
       ========================= */

    .view-count {
      grid-column: 1 / -1;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      font-size: 12px;

      color:
        rgba(255,255,255,.7);

      font-weight: 600;

      padding: 2px 6px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 768px) {

      body {
        padding: 12px;
      }

      .bio-container {
        max-width: 420px;

        display: flex;

        flex-direction: column;

        gap: 12px;

        padding: 16px;
      }

      /* PROFILE VẪN KHÔNG CÓ KHUNG */

      .profile-top {
        background: transparent !important;

        border: none !important;

        border-radius: 0 !important;

        padding: 0 !important;

        box-shadow: none !important;
      }

      .avatar-wrapper {
        width: 65px;
        height: 65px;
      }

      .display-name {
        font-size: 20px;
      }

      .social-links {
        width: 100%;

        justify-content: center;

        gap: 6px;
      }

      .social-icon {
        width: 38px;
        height: 38px;

        border-radius: 11px;
      }

      .social-icon img {
        width: 22px;
        height: 22px;
      }

      .guild-stats {
        gap: 5px;
      }

      .join-btn {
        padding: 6px 10px;
      }
    }

    /* =========================
       SMALL MOBILE
       ========================= */

    @media (max-width: 380px) {

      .social-links {
        gap: 4px;
      }

      .social-icon {
        width: 34px;
        height: 34px;
      }

      .social-icon img {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>

  <script>

    const DISCORD_USER_ID =
      "862273858214821929";

    const DISCORD_INVITE_CODE =
      "XEaC68tVnv";

    let offlineTimestamp = null;
    let timerInterval = null;


    /* ENTER */

    function enterSite() {

      const splash =
        document.getElementById(
          "splash-screen"
        );

      const bgAudio =
        document.getElementById(
          "bg-audio"
        );

      const video =
        document.getElementById(
          "bg-video"
        );


      if (splash) {

        splash.classList.add(
          "hidden"
        );

      }


      if (bgAudio) {

        bgAudio
          .play()
          .catch(err =>
            console.log(
              "Không phát được nhạc:",
              err
            )
          );

      }


      if (video) {

        video
          .play()
          .catch(err =>
            console.log(
              "Không phát được video:",
              err
            )
          );

      }

    }


    /* CLICK TEXT */

    const clickPhrases = [
      "Hanh Lẻ Năm",
      "Dev",
      "Hello!",
      "OwO",
      "Click!",
      "Code Website"
    ];


    window.addEventListener(
      "click",
      e => {

        const splash =
          document.getElementById(
            "splash-screen"
          );


        if (
          splash &&
          !splash.classList.contains(
            "hidden"
          )
        ) {
          return;
        }


        createFloatingText(
          e.clientX,
          e.clientY
        );

      }
    );


    function createFloatingText(x,y) {

      const el =
        document.createElement(
          "div"
        );


      el.className =
        "click-text-effect";


      const randomText =
        clickPhrases[
          Math.floor(
            Math.random() *
            clickPhrases.length
          )
        ];


      el.innerText =
        randomText;


      el.style.left =
        `${x}px`;

      el.style.top =
        `${y}px`;


      document.body.appendChild(
        el
      );


      setTimeout(
        () => el.remove(),
        800
      );

    }


    /* NAME */

    const nameWords = [
      "Hanh Lẻ Năm"
    ];

    let nameWordIndex = 0;
    let nameCharIndex = 0;
    let nameIsDeleting = false;


    const typedNameSpan =
      document.getElementById(
        "typed-name"
      );


    function typeNameEffect() {

      const currentWord =
        nameWords[nameWordIndex];


      if (nameIsDeleting) {

        typedNameSpan.textContent =
          currentWord.substring(
            0,
            nameCharIndex - 1
          );

        nameCharIndex--;

      } else {

        typedNameSpan.textContent =
          currentWord.substring(
            0,
            nameCharIndex + 1
          );

        nameCharIndex++;

      }


      let typeSpeed =
        nameIsDeleting
          ? 70
          : 120;


      if (
        !nameIsDeleting &&
        nameCharIndex ===
          currentWord.length
      ) {

        typeSpeed = 2000;

        nameIsDeleting = true;

      }


      else if (
        nameIsDeleting &&
        nameCharIndex === 0
      ) {

        nameIsDeleting = false;

        nameWordIndex =
          (nameWordIndex + 1) %
          nameWords.length;

        typeSpeed = 500;

      }


      setTimeout(
        typeNameEffect,
        typeSpeed
      );

    }


    /* ROLE */

    const roleWords = [
      "Dev",
      "Code Website",
      "Welcome to my Bio"
    ];

    let roleWordIndex = 0;
    let roleCharIndex = 0;
    let roleIsDeleting = false;


    const typedRoleSpan =
      document.getElementById(
        "typed-role"
      );


    function typeRoleEffect() {

      const currentWord =
        roleWords[roleWordIndex];


      if (roleIsDeleting) {

        typedRoleSpan.textContent =
          currentWord.substring(
            0,
            roleCharIndex - 1
          );

        roleCharIndex--;

      } else {

        typedRoleSpan.textContent =
          currentWord.substring(
            0,
            roleCharIndex + 1
          );

        roleCharIndex++;

      }


      let typeSpeed =
        roleIsDeleting
          ? 50
          : 90;


      if (
        !roleIsDeleting &&
        roleCharIndex ===
          currentWord.length
      ) {

        typeSpeed = 2000;

        roleIsDeleting = true;

      }


      else if (
        roleIsDeleting &&
        roleCharIndex === 0
      ) {

        roleIsDeleting = false;

        roleWordIndex =
          (roleWordIndex + 1) %
          roleWords.length;

        typeSpeed = 400;

      }


      setTimeout(
        typeRoleEffect,
        typeSpeed
      );

    }


    document.addEventListener(
      "DOMContentLoaded",
      () => {

        setTimeout(
          typeNameEffect,
          500
        );

        setTimeout(
          typeRoleEffect,
          800
        );

      }
    );


    /* LAST SEEN */

    function formatLastSeen(ts) {

      if (!ts)
        return "last seen recently";


      const diffSec =
        Math.floor(
          (Date.now() - ts) / 1000
        );


      if (diffSec < 60)
        return "last seen just now";


      const mins =
        Math.floor(diffSec / 60);


      if (mins < 60) {

        return `last seen ${mins} minute${
          mins > 1 ? "s" : ""
        } ago`;

      }


      const hours =
        Math.floor(mins / 60);


      if (hours < 24) {

        return `last seen ${hours} hour${
          hours > 1 ? "s" : ""
        } ago`;

      }


      const days =
        Math.floor(hours / 24);


      return `last seen ${days} day${
        days > 1 ? "s" : ""
      } ago`;

    }


    /* DISCORD USER */

    async function updateDiscordData() {

      try {

        const res =
          await fetch(
            `https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`
          );


        const result =
          await res.json();


        if (
          result.success &&
          result.data
        ) {

          const data =
            result.data;

          const user =
            data.discord_user;

          const status =
            data.discord_status;


          document.getElementById(
            "user-link-name"
          ).innerText =
            user.username;


          if (user.avatar) {

            const ext =
              user.avatar.startsWith("a_")
                ? "gif"
                : "png";


            const avatarUrl =
              `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;


            document.getElementById(
              "discord-avatar"
            ).src =
              avatarUrl;


            document.getElementById(
              "mini-avatar"
            ).src =
              avatarUrl;

          }


          if (
            user.avatar_decoration_data
          ) {

            const deco =
              document.getElementById(
                "avatar-deco"
              );


            deco.src =
              `https://cdn.discordapp.com/avatar-decoration-presets/${user.avatar_decoration_data.asset}.png`;


            deco.style.display =
              "block";

          }


          document.getElementById(
            "status-dot"
          ).className =
            `status-dot ${status}`;


          const statusElem =
            document.getElementById(
              "user-link-status"
            );


          if (
            status === "offline"
          ) {

            statusElem.classList.add(
              "offline-text"
            );


            let savedOfflineTime =
              localStorage.getItem(
                "discord_offline_time"
              );


            if (!savedOfflineTime) {

              savedOfflineTime =
                Date.now();


              localStorage.setItem(
                "discord_offline_time",
                savedOfflineTime
              );

            }


            offlineTimestamp =
              parseInt(
                savedOfflineTime
              );


            if (timerInterval)
              clearInterval(
                timerInterval
              );


            statusElem.innerText =
              formatLastSeen(
                offlineTimestamp
              );


            timerInterval =
              setInterval(
                () => {

                  statusElem.innerText =
                    formatLastSeen(
                      offlineTimestamp
                    );

                },
                10000
              );


          } else {

            localStorage.removeItem(
              "discord_offline_time"
            );


            statusElem.classList.remove(
              "offline-text"
            );


            offlineTimestamp = null;


            if (timerInterval)
              clearInterval(
                timerInterval
              );


            const customActivity =
              data.activities?.find(
                a => a.type === 4
              );


            if (
              customActivity &&
              (
                customActivity.state ||
                customActivity.emoji
              )
            ) {

              let statusHTML = "";


              if (
                customActivity.emoji
              ) {

                if (
                  customActivity.emoji.id
                ) {

                  const ext =
                    customActivity.emoji.animated
                      ? "gif"
                      : "png";


                  statusHTML +=
                    `<img class="status-emoji" src="https://cdn.discordapp.com/emojis/${customActivity.emoji.id}.${ext}">`;

                } else {

                  statusHTML +=
                    `${customActivity.emoji.name} `;

                }

              }


              if (
                customActivity.state
              ) {

                statusHTML +=
                  customActivity.state;

              }


              statusElem.innerHTML =
                statusHTML;

            } else {

              const statusTextMap = {

                dnd:
                  "Do Not Disturb",

                idle:
                  "Idle",

                online:
                  "Online now"

              };


              statusElem.innerText =
                statusTextMap[status] ||
                "Online now";

            }

          }

        }

      } catch (err) {

        console.error(
          "Lỗi API User:",
          err
        );

      }

    }


    /* DISCORD SERVER */

    async function updateServerData() {

      try {

        const res =
          await fetch(
            `https://discord.com/api/v9/invites/${DISCORD_INVITE_CODE}?with_counts=true`
          );


        const data =
          await res.json();


        if (
          data &&
          data.guild
        ) {

          document.getElementById(
            "guild-link"
          ).href =
            `https://discord.gg/${DISCORD_INVITE_CODE}`;


          document.getElementById(
            "guild-name"
          ).innerText =
            data.guild.name;


          document.getElementById(
            "guild-online"
          ).innerText =
            data.approximate_presence_count
              .toLocaleString();


          document.getElementById(
            "guild-members"
          ).innerText =
            data.approximate_member_count
              .toLocaleString();


          if (
            data.guild.icon
          ) {

            const ext =
              data.guild.icon.startsWith("a_")
                ? "gif"
                : "png";


            document.getElementById(
              "guild-icon"
            ).src =
              `https://cdn.discordapp.com/icons/${data.guild.id}/${data.guild.icon}.${ext}?size=128`;

          }

        }

      } catch (err) {

        console.error(
          "Lỗi API Server:",
          err
        );

      }

    }


    /* START */

    updateDiscordData();

    updateServerData();

    setInterval(
      updateDiscordData,
      30000
    );

  </script>
